<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đường đua tri thức – Tin học 10</title>
<style>
:root{--bg:#0b1224;--panel:#141f39;--line:#2b3b60;--cyan:#48d9e8;--gold:#ffd166;--green:#42d392;--red:#ff7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#1d3762,transparent 40%),linear-gradient(135deg,#080e1e,#101a33);color:#f5f7ff;font:16px/1.5 system-ui,Segoe UI,Arial;display:grid;place-items:center;padding:20px}.game{width:min(760px,100%);background:#101a30ee;border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:0 24px 80px #0008}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.tag{color:var(--cyan);font-weight:800;letter-spacing:.12em;font-size:.78rem}.score{font-weight:800;color:var(--gold)}h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.05;margin:18px 0 8px}.sub{color:#b7c5e5;margin:0 0 22px}.track{height:9px;background:#263653;border-radius:99px;overflow:hidden;margin:18px 0 24px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#8d8aff);transition:width .3s}.qnum{color:var(--cyan);font-weight:800;font-size:.9rem}.question{font-size:1.28rem;font-weight:750;margin:10px 0 20px}.answers{display:grid;gap:11px}.answer{border:1px solid var(--line);background:#192744;color:#f5f7ff;text-align:left;padding:14px 16px;border-radius:14px;font-size:1rem;cursor:pointer;transition:.15s}.answer:hover:not(:disabled){border-color:var(--cyan);transform:translateY(-1px)}.answer:disabled{cursor:default;opacity:1}.answer.correct{border-color:var(--green);background:#12382f}.answer.wrong{border-color:var(--red);background:#401f31}.feedback{margin-top:18px;padding:15px;border-radius:14px;background:#1a2947;color:#dce7ff}.feedback strong{display:block;margin-bottom:5px}.actions{display:flex;justify-content:flex-end;margin-top:18px}.next,.restart{border:0;border-radius:12px;background:var(--cyan);color:#071421;font-weight:850;padding:12px 20px;font-size:1rem;cursor:pointer}.hidden{display:none}.result{text-align:center;padding:20px 0}.big{font-size:3.2rem;color:var(--gold);font-weight:900}.rank{font-size:1.35rem;font-weight:850;color:var(--cyan)}footer{text-align:center;color:#8495b9;font-size:.8rem;margin-top:22px}@media(max-width:480px){body{padding:10px}.game{border-radius:18px}.question{font-size:1.12rem}}
</style></head>
<body><main class="game"><div class="top"><div class="tag">🏁 TRÒ CHƠI TIN HỌC 10</div><div class="score">⭐ Điểm: <span id="score">0</span></div></div><h1>ĐƯỜNG ĐUA<br>TRI THỨC</h1><p class="sub">Chinh phục 8 câu hỏi – mỗi câu đúng nhận 10 điểm!</p><div id="play"><div class="track"><div class="bar" id="bar"></div></div><div class="qnum" id="qnum">CÂU 1 / 8</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback hidden" id="feedback"></div><div class="actions"><button class="next hidden" id="next">Câu tiếp theo →</button></div></div><div id="result" class="result hidden"></div><footer>Chúc em bình tĩnh, tự tin và đạt điểm cao!</footer></main>
<script>
const data=[
{q:'Thiết bị nào sau đây được xem là thiết bị nhập dữ liệu?',o:['Màn hình','Bàn phím','Loa','Máy chiếu'],a:1,e:'Bàn phím dùng để nhập kí tự và lệnh vào máy tính.'},
{q:'Đơn vị nào sau đây dùng để đo dung lượng thông tin?',o:['Mét','Giây','Byte','Kilogram'],a:2,e:'Byte là đơn vị đo dung lượng thông tin; các bội số thường gặp là KB, MB, GB, TB.'},
{q:'Trong hệ nhị phân, số 10 có giá trị thập phân là bao nhiêu?',o:['1','2','10','3'],a:1,e:'Số nhị phân 10 = 1 × 2¹ + 0 × 2⁰ = 2.'},
{q:'Phần mềm nào sau đây là hệ điều hành?',o:['Microsoft Word','Google Chrome','Windows','PowerPoint'],a:2,e:'Windows là hệ điều hành, quản lí tài nguyên và hoạt động của máy tính.'},
{q:'Mạng máy tính là gì?',o:['Tập hợp các máy tính được kết nối để trao đổi dữ liệu và chia sẻ tài nguyên','Một máy tính có cấu hình mạnh','Một phần mềm dùng để soạn thảo văn bản','Một thiết bị lưu trữ dữ liệu'],a:0,e:'Mạng máy tính kết nối các thiết bị để trao đổi thông tin và chia sẻ tài nguyên.'},
{q:'Hành động nào giúp bảo vệ tài khoản trực tuyến?',o:['Dùng chung mật khẩu với bạn','Đặt mật khẩu là ngày sinh','Gửi mật khẩu cho người khác','Sử dụng mật khẩu mạnh và xác thực hai yếu tố'],a:3,e:'Mật khẩu mạnh kết hợp xác thực hai yếu tố giúp tăng cường bảo mật tài khoản.'},
{q:'Thuật toán là gì?',o:['Một thiết bị xử lí dữ liệu','Một dãy hữu hạn các bước để giải quyết một bài toán','Một ngôn ngữ lập trình cụ thể','Một loại bộ nhớ máy tính'],a:1,e:'Thuật toán là dãy hữu hạn các bước rõ ràng, có thứ tự để giải quyết bài toán.'},
{q:'Khi nhận được email có đường link lạ yêu cầu nhập mật khẩu, em nên làm gì?',o:['Nhấn vào link ngay','Chuyển tiếp cho bạn bè','Không nhấn link, kiểm tra người gửi và báo cáo nếu đáng ngờ','Nhập mật khẩu để xác minh'],a:2,e:'Đây có thể là hành vi lừa đảo phishing. Không truy cập link đáng ngờ hoặc cung cấp thông tin đăng nhập.'}
];let idx=0,score=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;$('score').textContent=score;$('qnum').textContent=`CÂU ${idx+1} / ${data.length}`;$('bar').style.width=`${idx/data.length*100}%`;$('question').textContent=data[idx].q;$('answers').innerHTML='';$('feedback').classList.add('hidden');$('next').classList.add('hidden');data[idx].o.forEach((v,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+v;b.onclick=()=>choose(i);$('answers').appendChild(b)})}function choose(i){if(locked)return;locked=true;let q=data[idx],buttons=[...$('answers').children];buttons.forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add('correct');if(n===i&&i!==q.a)b.classList.add('wrong')});let ok=i===q.a;if(ok)score+=10;$('score').textContent=score;$('feedback').innerHTML=`<strong>${ok?'✓ Chính xác! +10 điểm':'✗ Chưa chính xác!'}</strong>${q.e}`;$('feedback').classList.remove('hidden');$('next').textContent=idx===data.length-1?'Xem kết quả':'Câu tiếp theo →';$('next').classList.remove('hidden')}function finish(){$('play').classList.add('hidden');let rank=score>=70?'CHUYÊN GIA TIN HỌC':score>=50?'CHIẾN BINH CÔNG NGHỆ':score>=30?'NHÀ KHÁM PHÁ':'TÂN BINH TIN HỌC';$('result').innerHTML=`<div style="font-size:3rem">🏆</div><h2>HOÀN THÀNH ĐƯỜNG ĐUA!</h2><div class="big">${score}/80</div><div class="rank">${rank}</div><p>${score>=70?'Xuất sắc! Em đã nắm vững nhiều kiến thức Tin học 10.':score>=50?'Rất tốt! Hãy tiếp tục phát huy nhé.':'Cố gắng ôn tập và thử sức thêm một lần nữa nhé!'}</p><button class="restart" onclick="restart()">↻ Chơi lại</button>`;$('result').classList.remove('hidden')}function restart(){idx=0;score=0;$('play').classList.remove('hidden');$('result').classList.add('hidden');render()}$('next').onclick=()=>{if(idx===data.length-1)finish();else{idx++;render()}};render();
</script></body></html>
